
<!DOCTYPE html>
<html>
  <head>
    <title>best age calc in th word btw</title>
    <link rel="stylesheet" href="../CSS/smt.css" />
  </head>
  <body>
      <h1 class="title">Welcome to my age calculator!</h1>
      <p id="currentTime"></p>
      <hr>
      <script src="../JS/ssm23.js"></script>
      <div class="container">
        <h1>AGE CALCULATOR</h1>
        <div class="input-box">
          <input type="date" id="date" onclick="this.showPicker()">
          <button onclick="CalculateAge()">Calculate</button>
        </div>
        <div>
          <p id="answer"></p>
        </div>
        <script>
          let CurrentDate = Date()
          let userInput = document.getElementById("date")
          userInput.max = new Date().toISOString().split("T")[0];
          let answer = document.getElementById("answer");
          function CalculateAge(){
            let birthdate = new Date(userInput.value.replace(/-/g, '\/'));
            let d1 = birthdate.getDate();
            let m1 = birthdate.getMonth() + 1;
            let y1 = birthdate.getFullYear();
            let today = new Date();
            let d2 = today.getDate();
            let m2 = today.getMonth() + 1;
            let y2 = today.getFullYear();
            let d3, m3, y3;
            y3 = y2 - y1;
            if(m2 >= m1){
             m3 = m2 - m1;
            }else{
              y3--;
              m3 = 12 + m2 - m1;
            }
            if(d2 >=d1){
              d3 = d2 - d1;
            }else{
              m3--;
              d3 = getdaysinmonth(y1, m1) + d2 - d1;
            }
            if(m3 < 0){
              m3 = 11;
              y3--;
            }
            answer.innerHTML = `your age is ${y3} years, ${m3} months, and ${d3} days old :)`;
          }
          function getdaysinmonth(year, month){
            return new Date(year, month, 0).getDate();
          }
        </script>
      </div>
  </body>
</html>
